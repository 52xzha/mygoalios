name: Build iOS App from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unpack project archive
      run: |
        unzip -o MyGoal-iOS.zip
        # Так как внутри архива папка MyGoal-iOS, вытаскиваем всё наружу в корень
        cp -R MyGoal-iOS/* .
        ls -la

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Build App for iOS
      run: |
        xcodebuild -project MyGoal.xcodeproj \
                   -scheme MyGoal \
                   -configuration Release \
                   -sdk iphoneos \
                   -derivedDataPath build \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   clean build

    - name: Create IPA Package
      run: |
        mkdir -p Payload
        cp -r build/Build/Products/Release-iphoneos/*.app Payload/
        zip -r MyGoal.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MyGoal-iOS-App
        path: MyGoal.ipa
        
