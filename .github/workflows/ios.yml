name: Build iOS App from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unpack project archive
      run: |
        unzip -o MyGoal-iOS.zip
        # Переносим всё содержимое из подпапок наружу, если они создались
        if [ -d "MyGoal-iOS" ]; then
          cp -R MyGoal-iOS/* .
        fi
        ls -la

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: |
        if [ -f "project.yml" ]; then
          xcodegen generate
        else
          echo "Error: project.yml not found!" && exit 1
        fi

    - name: Build App for iOS
      run: |
        # Ищем сгенерированный проект динамически
        XCODOPROJ=$(ls -d *.xcodeproj | head -n 1)
        SCHEME=$(basename "$XCODOPROJ" .xcodeproj)
        
        xcodebuild -project "$XCODOPROJ" \
                   -scheme "$SCHEME" \
                   -configuration Release \
                   -sdk iphoneos \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   clean build

    - name: Create IPA Package
      run: |
        mkdir -p Payload
        cp -r build/Release-iphoneos/*.app Payload/
        zip -r MyGoal.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MyGoal-iOS-App
        path: MyGoal.ipa
        
